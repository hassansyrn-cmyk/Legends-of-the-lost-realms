name: Unity 3D Android APK

on:
  push:
    branches: [ chatgpt-astra/unity-3d ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK and metadata as a public prerelease
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-unity-3d-apk:
    name: Build Unity 3D Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity CI configuration
        shell: bash
        run: bash .github/scripts/verify-unity-ci-config.sh

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity-3d/Library
          key: Unity6-Android-Library-${{ hashFiles('unity-3d/Assets/**', 'unity-3d/Packages/**', 'unity-3d/ProjectSettings/**') }}

      - name: Build Unity 3D Android Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-3d
          unityVersion: 6000.6.0f1
          targetPlatform: Android
          buildMethod: RealmBuild.Android
          buildName: LostRealms3D
          dockerCpuLimit: 2

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          APK_SRC="$(find unity-3d/Builds/Android build -name '*.apk' 2>/dev/null | head -n 1)"
          if [ -z "$APK_SRC" ]; then
            APK_SRC="build/Android/LostRealms3D.apk"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="Legends_of_the_Lost_Realms_3D_${SHORT_SHA}-debug.apk"
          ARTIFACT_NAME="Legends-of-the-Lost-Realms-3D-${SHORT_SHA}-debug-apk"

          cp "$APK_SRC" "$APK_NAME"

          cat > APK_BUILD_METADATA.txt <<EOF
          Legends of the Lost Realms 3D Debug APK
          Engine: Unity 6000.6.0f1
          Character phase: Supplied Mixamo Aster model with 12 animation states, including double-jump flip
          Source revision: ${GITHUB_SHA}
          Branch: chatgpt-astra/unity-3d
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=unity3d-v0.1.0-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.metadata.outputs.apk_name }}
            APK_BUILD_METADATA.txt
            unity-3d/ASTER_PHASE1_REPORT.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish public debug release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          TAG="${{ steps.metadata.outputs.release_tag }}"
          APK="${{ steps.metadata.outputs.apk_name }}"
          METADATA="APK_BUILD_METADATA.txt"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi

          test -s "$APK"
          test -s "$METADATA"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Legends of the Lost Realms 3D Unity Debug Build" \
            --notes "3D Unity Android debug APK rebuild.

          Engine: Unity 6 (6000.6.0f1)
          Source revision: ${GITHUB_SHA}
          Branch: chatgpt-astra/unity-3d
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --prerelease \
            --latest=false \
            "$APK" \
            "$METADATA"

          asset_count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$asset_count" -ge 1
          echo "Published ${TAG} with verified 3D Unity release assets."
