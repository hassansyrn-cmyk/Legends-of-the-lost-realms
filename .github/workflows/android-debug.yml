name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure local Android SDK path
        shell: bash
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Run project verification and build
        shell: bash
        run: |
          gradle :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk Legends_of_the_Lost_Realms_v4.11.4-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legends-of-the-Lost-Realms-v4.11.4-debug-apk
          path: Legends_of_the_Lost_Realms_v4.11.4-debug.apk
          if-no-files-found: error
          retention-days: 30
