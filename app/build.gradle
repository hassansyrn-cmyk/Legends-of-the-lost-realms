plugins {
    id 'com.android.application'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'com.manus.lostrealms'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.manus.lostrealms'
        minSdk 24
        targetSdk 35
        versionCode 64
        versionName '5.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}
